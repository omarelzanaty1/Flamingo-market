<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FLOUSY – Personal Finance Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
  </style>
</head>
<body class="bg-[#0f1711] text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CURRENT_MIGRATION_VERSION = 'v2_clean_defaults';
    const checkAndCleanStorage = () => {
      try {
        const migration = localStorage.getItem('flousy_migration_version');
        if (migration !== CURRENT_MIGRATION_VERSION) {
          localStorage.removeItem('flousy_accounts');
          localStorage.removeItem('flousy_obligations');
          localStorage.removeItem('flousy_essentials');
          localStorage.removeItem('flousy_wishlist');
          localStorage.removeItem('flousy_notes_debts');
          localStorage.setItem('flousy_migration_version', CURRENT_MIGRATION_VERSION);
        }
      } catch (e) {
        console.error("Migration error:", e);
      }
    };

    function App() {
      const [showSplash, setShowSplash] = useState(true);

      useEffect(() => {
        checkAndCleanStorage();
        const timer = setTimeout(() => setShowSplash(false), 5000);
        return () => clearTimeout(timer);
      }, []);

      const [activeTab, setActiveTab] = useState('wallet');
      const [darkMode, setDarkMode] = useState(true);
      const [hideBalances, setHideBalances] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const [accounts, setAccounts] = useState(() => {
        try {
          const saved = localStorage.getItem('flousy_accounts');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [obligations, setObligations] = useState(() => {
        try {
          const saved = localStorage.getItem('flousy_obligations');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [essentials, setEssentials] = useState(() => {
        try {
          const saved = localStorage.getItem('flousy_essentials');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [wishlist, setWishlist] = useState(() => {
        try {
          const saved = localStorage.getItem('flousy_wishlist');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [notesDebts, setNotesDebts] = useState(() => {
        try {
          const saved = localStorage.getItem('flousy_notes_debts');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      useEffect(() => { localStorage.setItem('flousy_accounts', JSON.stringify(accounts)); }, [accounts]);
      useEffect(() => { localStorage.setItem('flousy_obligations', JSON.stringify(obligations)); }, [obligations]);
      useEffect(() => { localStorage.setItem('flousy_essentials', JSON.stringify(essentials)); }, [essentials]);
      useEffect(() => { localStorage.setItem('flousy_wishlist', JSON.stringify(wishlist)); }, [wishlist]);
      useEffect(() => { localStorage.setItem('flousy_notes_debts', JSON.stringify(notesDebts)); }, [notesDebts]);

      const [modalType, setModalType] = useState(null);
      const [editingItem, setEditingItem] = useState(null);

      const totalBalance = accounts
        .filter(acc => acc.status === 'active')
        .reduce((sum, acc) => sum + (parseFloat(acc.balance) || 0), 0);

      const totalObligations = obligations.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
      const paidObligations = obligations.filter(item => item.isPaid).reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);

      if (showSplash) {
        return (
          <div className="fixed inset-0 bg-[#0a0f0d] text-white flex flex-col items-center justify-center z-50 font-sans select-none px-4 text-center">
            <div className="relative flex flex-col items-center">
              <div className="relative w-28 h-28 flex items-center justify-center mb-6">
                <svg className="w-full h-full animate-pulse" viewBox="0 0 100 100" fill="none">
                  <path d="M30 20 H75 M30 20 V80 M30 50 H65" stroke="#10b981" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
              </div>
              <div className="flex items-end gap-2 h-10 mb-6">
                <div className="w-2.5 bg-emerald-600 rounded-t-md animate-bounce h-5"></div>
                <div className="w-2.5 bg-emerald-500 rounded-t-md animate-bounce h-8"></div>
                <div className="w-2.5 bg-emerald-400 rounded-t-md animate-bounce h-10"></div>
              </div>
              <h1 className="text-3xl font-extrabold tracking-wider text-white mb-2 font-mono">FLOUSY</h1>
              <p className="text-emerald-400 text-xs sm:text-sm font-medium mb-8">Your Money. Your Control.</p>
              <div className="w-44 h-1.5 bg-gray-800 rounded-full overflow-hidden">
                <div className="h-full bg-emerald-500 rounded-full animate-[loading_5s_linear_forwards]"></div>
              </div>
            </div>
            <style>{`@keyframes loading { 0% { width: 0%; } 100% { width: 100%; } }`}</style>
          </div>
        );
      }

      return (
        <div dir="rtl" className={`min-h-screen font-sans transition-colors duration-300 pb-20 md:pb-8 ${darkMode ? 'bg-[#0f1711] text-gray-100' : 'bg-gray-50 text-gray-800'}`}>
          
          {/* Header متجاوب 100% */}
          <header className={`sticky top-0 z-40 border-b backdrop-blur-md ${darkMode ? 'bg-[#0f1711]/90 border-emerald-900/30' : 'bg-white/90 border-emerald-200'}`}>
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
              
              <div className="flex items-center gap-2.5 shrink-0">
                <div className="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-500 font-bold text-lg">F</div>
                <span className="text-lg font-bold text-emerald-400 font-mono tracking-wider">FLOUSY</span>
              </div>

              {/* أزرار التنقل تظهر في
