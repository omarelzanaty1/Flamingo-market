<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title-[#10b981]">FLOUSY – Personal Finance Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0f1711] text-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CURRENT_MIGRATION_VERSION = 'v2_clean_defaults';
    const checkAndCleanStorage = () => {
      try {
        const migration = localStorage.getItem('flousy_migration_version');
        if (migration !== CURRENT_MIGRATION_VERSION) {
          localStorage.removeItem('flousy_accounts');
          localStorage.removeItem('flousy_obligations');
          localStorage.removeItem('flousy_essentials');
          localStorage.removeItem('flousy_wishlist');
          localStorage.removeItem('flousy_notes_debts');
          localStorage.setItem('flousy_migration_version', CURRENT_MIGRATION_VERSION);
        }
      } catch (e) {
        console.error("Migration error:", e);
      }
    };

    function App() {
      const [showSplash, setShowSplash] = useState(true);

      useEffect(() => {
        checkAndCleanStorage();
        const timer = setTimeout(() => setShowSplash(false), 5000);
        return () => clearTimeout(timer);
      }, []);

      const [activeTab, setActiveTab] = useState('wallet');
      const [darkMode, setDarkMode] = useState(true);
      const [hideBalances, setHideBalances] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const [accounts, setAccounts] = useState(() => {
        try {
          const saved = localStorage.getItem('flousy_accounts');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [obligations, setObligations] = useState(() => {
        try {
          const saved = localStorage.getItem('flousy_obligations');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [essentials, setEssentials] = useState(() => {
        try {
          const saved = localStorage.getItem('flousy_essentials');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [wishlist, setWishlist] = useState(() => {
        try {
          const saved = localStorage.getItem('flousy_wishlist');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      const [notesDebts, setNotesDebts] = useState(() => {
        try {
          const saved = localStorage.getItem('flousy_notes_debts');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });

      useEffect(() => { localStorage.setItem('flousy_accounts', JSON.stringify(accounts)); }, [accounts]);
      useEffect(() => { localStorage.setItem('flousy_obligations', JSON.stringify(obligations)); }, [obligations]);
      useEffect(() => { localStorage.setItem('flousy_essentials', JSON.stringify(essentials)); }, [essentials]);
      useEffect(() => { localStorage.setItem('flousy_wishlist', JSON.stringify(wishlist)); }, [wishlist]);
      useEffect(() => { localStorage.setItem('flousy_notes_debts', JSON.stringify(notesDebts)); }, [notesDebts]);

      const [modalType, setModalType] = useState(null);
      const [editingItem, setEditingItem] = useState(null);

      const totalBalance = accounts
        .filter(acc => acc.status === 'active')
        .reduce((sum, acc) => sum + (parseFloat(acc.balance) || 0), 0);

      const totalObligations = obligations.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
      const paidObligations = obligations.filter(item => item.isPaid).reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);

      if (showSplash) {
        return (
          <div className="fixed inset-0 bg-[#0a0f0d] text-white flex flex-col items-center justify-center z-50 font-sans select-none">
            <div className="relative flex flex-col items-center">
              <div className="relative w-32 h-32 flex items-center justify-center mb-6">
                <svg className="w-full h-full animate-pulse" viewBox="0 0 100 100" fill="none">
                  <path d="M30 20 H75 M30 20 V80 M30 50 H65" stroke="#10b981" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
              </div>
              <div className="flex items-end gap-2 h-12 mb-6">
                <div className="w-3 bg-emerald-600 rounded-t-md animate-bounce h-6"></div>
                <div className="w-3 bg-emerald-500 rounded-t-md animate-bounce h-9"></div>
                <div className="w-3 bg-emerald-400 rounded-t-md animate-bounce h-12"></div>
              </div>
              <h1 className="text-3xl font-extrabold tracking-wider text-white mb-2 font-mono">FLOUSY</h1>
              <p className="text-emerald-400 text-sm font-medium mb-8">Your Money. Your Control.</p>
              <div className="w-48 h-1.5 bg-gray-800 rounded-full overflow-hidden">
                <div className="h-full bg-emerald-500 rounded-full animate-[loading_5s_linear_forwards]"></div>
              </div>
            </div>
            <style>{`@keyframes loading { 0% { width: 0%; } 100% { width: 100%; } }`}</style>
          </div>
        );
      }

      return (
        <div dir="rtl" className={`min-h-screen font-sans transition-colors ${darkMode ? 'bg-[#0f1711] text-gray-100' : 'bg-gray-50 text-gray-800'}`}>
          <header className={`sticky top-0 z-40 border-b backdrop-blur-md ${darkMode ? 'bg-[#0f1711]/80 border-emerald-900/30' : 'bg-white/80 border-emerald-100'}`}>
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-500 font-bold text-xl">F</div>
                <div>
                  <span className="text-lg font-bold text-emerald-400">FLOUSY</span>
                  <span className="hidden sm:inline-block mr-2 text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400">Your Money. Your Control.</span>
                </div>
              </div>

              <nav className="flex items-center gap-1 bg-emerald-950/20 p-1 rounded-xl border border-emerald-500/20">
                <button onClick={() => setActiveTab('wallet')} className={`px-4 py-2 rounded-lg text-sm font-medium ${activeTab === 'wallet' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-gray-400'}`}>فلوسي</button>
                <button onClick={() => setActiveTab('expenses')} className={`px-4 py-2 rounded-lg text-sm font-medium ${activeTab === 'expenses' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-gray-400'}`}>مصاريفي</button>
                <button onClick={() => setActiveTab('notesDebts')} className={`px-4 py-2 rounded-lg text-sm font-medium ${activeTab === 'notesDebts' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-gray-400'}`}>ديوني وملاحظاتي</button>
              </nav>

              <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl border border-emerald-800 text-amber-400">
                {darkMode ? '☀️' : '🌙'}
              </button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-8">
            {activeTab === 'wallet' && (
              <div className="space-y-6">
                <div className="p-8 rounded-3xl border bg-gradient-to-br from-emerald-950 to-teal-950 border-emerald-800 flex justify-between items-center">
                  <div>
                    <span className="text-xs font-semibold text-emerald-400">إجمالي الأموال</span>
                    <h2 className="text-4xl font-extrabold mt-2 font-mono text-emerald-400">{hideBalances ? '•••••• EGP' : `${totalBalance.toLocaleString()} EGP`}</h2>
                  </div>
                  <button onClick={() => { setEditingItem(null); setModalType('account'); }} className="px-5 py-3 rounded-2xl bg-emerald-500 text-slate-950 font-bold">+ إضافة حساب</button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {accounts.map(acc => (
                    <div key={acc.id} className="p-5 rounded-2xl border bg-emerald-950/20 border-emerald-900 flex justify-between items-center">
                      <div>
                        <h4 className="font-bold">{acc.name}</h4>
                        <p className="text-emerald-400 font-mono font-bold mt-1">{parseFloat(acc.balance || 0).toLocaleString()} EGP</p>
                      </div>
                      <button onClick={() => setAccounts(accounts.filter(a => a.id !== acc.id))} className="text-red-400 text-xs">حذف</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'expenses' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-lg">الاشتراكات الشهرية</h3>
                  <button onClick={() => { setEditingItem(null); setModalType('obligation'); }} className="px-4 py-2 bg-emerald-500 text-slate-950 font-bold text-sm rounded-xl">+ إضافة اشتراك</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {obligations.map(item => (
                    <div key={item.id} className="p-4 rounded-xl border bg-emerald-950/20 border-emerald-900 flex justify-between">
                      <div>
                        <h4 className="font-bold">{item.name}</h4>
                        <p className="text-emerald-400 font-mono">{item.amount} EGP</p>
                      </div>
                      <button onClick={() => setObligations(obligations.filter(o => o.id !== item.id))} className="text-red-400 text-xs">حذف</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'notesDebts' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-lg">الديون والملاحظات</h3>
                  <button onClick={() => { setEditingItem(null); setModalType('noteDebt'); }} className="px-4 py-2 bg-emerald-500 text-slate-950 font-bold text-sm rounded-xl">+ إضافة ملاحظة</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {notesDebts.map(item => (
                    <div key={item.id} className="p-4 rounded-xl border bg-emerald-950/20 border-emerald-900">
                      <h4 className="font-bold text-emerald-400">{item.title}</h4>
                      <p className="text-sm mt-2 text-gray-300">{item.content}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
